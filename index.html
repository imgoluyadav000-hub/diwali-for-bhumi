:root{
  --bg:#07020f;
  --bg2:#14051f;
  --surface:#1a0b2b;
  --surface2:#2a123e;
  --ink:#fff7e8;
  --muted:#d9c7e7;
  --gold:#ffc94d;
  --gold2:#ff9a2e;
  --pink:#ff5d8f;
  --rose:#ff8fb0;
  --orange:#ff6b2c;
  --line:rgba(255,201,77,.28);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#05010d;
    --surface:#180a28;
  }
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  font-family:'Manrope',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow-x:clip;
}

.script{
  font-family:'Great Vibes',cursive;
  font-weight:400;
}

.glow{
  text-shadow:0 0 18px rgba(255,190,70,.85), 0 0 42px rgba(255,107,44,.65), 0 0 80px rgba(255,93,143,.35);
}

.gold-text{
  background:linear-gradient(100deg,#fff3b0 0%,#ffc94d 34%,#ff7a2f 62%,#ff5d8f 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.card-glass{
  background:linear-gradient(160deg, rgba(255,255,255,.11), rgba(255,140,70,.08));
  border:1px solid rgba(255,201,77,.32);
  box-shadow:0 24px 70px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.14);
  backdrop-filter:blur(14px);
}

.btn-gold{
  background:linear-gradient(135deg,#ffd45e,#ff7a2f 58%,#ff4e7a);
  color:#2a0a12;
  box-shadow:0 10px 34px rgba(255,120,40,.45), inset 0 1px 0 rgba(255,255,255,.55);
}

.btn-gold:active{
  transform:translateY(2px) scale(.98);
}

.btn-ghost{
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.07);
}

@keyframes twinkle{
  0%,100%{
    opacity:.15;
    transform:scale(.7);
  }

  50%{
    opacity:1;
    transform:scale(1.15);
  }
}

@keyframes floatY{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }

  50%{
    transform:translateY(-14px) rotate(3deg);
  }
}

@keyframes floatHeart{
  0%{
    transform:translateY(105vh) rotate(-10deg);
    opacity:0;
  }

  8%{
    opacity:.9;
  }

  92%{
    opacity:.75;
  }

  100%{
    transform:translateY(-12vh) rotate(18deg);
    opacity:0;
  }
}

@keyframes flicker{
  0%,100%{
    transform:scale(1) rotate(-2deg);
    opacity:1;
  }

  25%{
    transform:scale(1.14) rotate(2deg);
    opacity:.92;
  }

  50%{
    transform:scale(.94) rotate(-3deg);
  }

  75%{
    transform:scale(1.08) rotate(1deg);
  }
}

@keyframes sway{
  0%,100%{
    transform:rotate(-3deg);
  }

  50%{
    transform:rotate(3deg);
  }
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(22px) scale(.97);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 35px rgba(255,170,40,.65), 0 0 90px rgba(255,100,50,.28);
  }

  50%{
    box-shadow:0 0 60px rgba(255,190,60,.95), 0 0 130px rgba(255,90,130,.42);
  }
}

@keyframes shimmer{
  from{
    background-position:0% 50%;
  }

  to{
    background-position:200% 50%;
  }
}

.rise{
  animation:rise .7s ease both;
}

.rise2{
  animation:rise .7s .12s ease both;
}

.rise3{
  animation:rise .7s .24s ease both;
}
